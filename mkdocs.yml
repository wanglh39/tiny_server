site_name: tiny_server 教学文档
site_description: 用纯 C 从零理解计算机网络底层原理
site_url: https://wanglh39.github.io/tiny_server/
repo_url: https://github.com/wanglh39/tiny_server
repo_name: wanglh39/tiny_server

theme:
  name: material
  language: zh
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换暗色模式
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换亮色模式

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.keys
  - attr_list
  - def_list
  - footnotes

nav:
  - 首页: index.md
  - 第一阶段 - 基础:
      - 字节序与结构体对齐: 00_byte_order.md
      - stage0 - raw socket 抓包: 01_raw_sniff.md
      - stage1 - 阻塞 echo server: 02_echo_blocking.md
      - stage2 - 多进程 fork: 03_echo_fork.md
      - stage3 - select 多路复用: 04_echo_select.md
      - stage4 - epoll LT 与 ET: 05_echo_epoll.md
      - stage5 - HTTP 状态机解析: 06_http_parser.md
      - stage6 - 主从 Reactor: 07_reactor.md
      - stage7 - 完整 Web 服务器: 08_webserver.md
      - 聚合版服务器: 09_server.md
  - 第二阶段 - 进阶:
      - stage8 - TLS/HTTPS: 10_tls_https.md
      - stage9 - io_uring 异步 IO: 11_io_uring.md
      - stage10 - 内存池 + 异步日志: 12_mempool_log.md
      - stage11 - SO_REUSEPORT 多核: 13_reuseport.md
      - stage12 - WebSocket 协议: 14_websocket.md
      - stage13 - 协程 Coroutine: 15_coroutine.md
      - stage14 - HTTP/2 协议: 16_http2.md
      - 聚合版高级服务器: 17_advanced_server.md
